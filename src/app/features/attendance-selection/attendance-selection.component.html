<div class="page">
  <header class="hero">
    <div class="hero__pattern" aria-hidden="true"></div>
    <div class="hero__content">
      <span class="hero__eyebrow">تسجيل الحضور</span>
      <h1 class="hero__title">مؤتمر Profile 7</h1>
      <p class="hero__subtitle">اختر الطريقة التي ستحضر بها المؤتمر لبدء التسجيل</p>
    </div>
  </header>

  <main class="card">
    <div class="poster">
      <img
        *ngIf="!posterLoadFailed()"
        src="assets/profile7-poster.jpg"
        alt="ملصق مؤتمر Profile 7"
        class="poster__image"
        (error)="onPosterError()"
      >
      <div class="poster__fallback" *ngIf="posterLoadFailed()">
        <span class="poster__fallback-title">مؤتمر Profile 7</span>
      </div>
    </div>

    <div class="options">
      <app-attendance-card
        *ngFor="let card of cards"
        [number]="card.number"
        [titleLine1]="card.titleLine1"
        [titleLine2]="card.titleLine2"
        [theme]="card.theme"
        [icon]="card.icon"
        [selected]="selected() === card.value"
        [ariaLabel]="card.ariaLabel"
        (select)="selectOption(card.value)"
      ></app-attendance-card>
    </div>
  </main>
</div>
